<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suivi Pédagogique — Doc-torat</title>
  <link rel="icon" type="image/jpeg" href="./bonlogo.jpg">
  <link rel="apple-touch-icon" href="./bonlogo.jpg">
  <style>
    :root {
      --primary: #1a365d;
      --accent: #2b6cb0;
      --bg: #f7fafc;
      --card-bg: #ffffff;
      --text: #2d3748;
      --text-muted: #718096;
      --border: #e2e8f0;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 20px 12px;
      min-height: 100vh;
    }

    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 440px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      border: 1px solid var(--border);
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .student-badge {
      background: #edf2f7;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
      color: var(--primary);
      margin-bottom: 16px;
    }

    .tab-switch {
      display: flex;
      background: #edf2f7;
      padding: 4px;
      border-radius: 10px;
      width: 100%;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 9px 0;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: #ffffff;
      color: var(--primary);
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.06);
    }

    .tab-content {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .gauge-container {
      width: 100%;
      background: #edf2f7;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      margin-bottom: 18px;
    }

    .total-hours {
      font-size: 42px;
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
      transition: color 0.3s ease;
    }

    .heures-negatives {
      color: var(--danger) !important;
    }

    .banner-renouvellement {
      margin-top: 14px;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.4;
      text-align: center;
    }

    .total-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 6px;
    }

    .details-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      margin-bottom: 24px;
    }

    .detail-box {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      text-align: center;
    }

    .detail-val {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }

    .detail-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .action-zone {
      width: 100%;
    }

    .action-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      display: block;
      margin-bottom: 8px;
    }

    .select-forfait {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      font-size: 14px;
      margin-bottom: 12px;
      background: #ffffff;
      color: var(--text);
      outline: none;
    }

    .select-forfait:focus {
      border-color: var(--accent);
    }

    .btn-commander {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-commander:hover {
      background: #102a43;
    }

    .btn-commander:disabled {
      background: #a0aec0;
      cursor: not-allowed;
    }

    .facture-badge {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 16px;
      background: #edf2f7;
      padding: 5px 12px;
      border-radius: 6px;
      text-align: center;
    }

    .gauge-wrapper {
      position: relative;
      width: 230px;
      height: 125px;
      display: flex;
      justify-content: center;
      margin: 10px 0 16px 0;
    }

    .semi-gauge {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    #gauge-progress {
      transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.4s ease;
    }

    .gauge-center-text {
      position: absolute;
      bottom: 6px;
      text-align: center;
    }

    .solde-du {
      font-size: 32px;
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
      transition: color 0.4s ease;
    }

    .solde-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-top: 5px;
      display: block;
    }

    /* Paliers de couleurs dynamiques */
    .color-success {
      color: var(--success) !important;
      stroke: var(--success) !important;
    }
    .color-warning {
      color: var(--warning) !important;
      stroke: var(--warning) !important;
    }
    .color-danger {
      color: var(--danger) !important;
      stroke: var(--danger) !important;
    }
    .color-neutral {
      color: var(--text-muted) !important;
      stroke: #cbd5e1 !important;
    }

    .finance-details {
      display: flex;
      justify-content: space-between;
      width: 100%;
      border-top: 1px solid var(--border);
      padding-top: 16px;
      margin-top: 14px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .finance-details strong {
      color: var(--text);
    }

    .past-invoices-section {
      width: 100%;
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .past-invoices-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .past-invoices-title.danger {
      color: var(--danger);
    }

    .past-invoices-list {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    .past-invoices-list.impayees {
      background: #fff5f5;
      border-color: #fed7d7;
    }

    .past-invoice-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      font-size: 13px;
      border-bottom: 1px solid var(--border);
    }

    .past-invoice-row.impayee {
      border-bottom: 1px solid #fee2e2;
    }

    .past-invoice-row:last-child {
      border-bottom: none;
    }

    .past-invoice-meta {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .past-invoice-no {
      font-weight: 600;
      color: var(--primary);
    }

    .past-invoice-date {
      font-size: 11px;
      color: var(--text-muted);
    }

    .past-invoice-tag {
      font-weight: 700;
      color: var(--success);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .past-invoice-tag-danger {
      font-weight: 700;
      color: var(--danger);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .last-update {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      letter-spacing: 0.3px;
      opacity: 0.85;
    }

    .loader {
      font-size: 14px;
      color: var(--text-muted);
      padding: 40px 0;
      text-align: center;
    }

    .confirmation-msg {
      background: #f0fff4;
      border: 1px solid #c6f6d5;
      color: #22543d;
      padding: 16px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { initializeAppCheck, ReCaptchaEnterpriseProvider } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app-check.js";
    import { getFirestore, doc, onSnapshot, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDUmgeU_jG00z-wiQLdGvkc1jEjkmsqqGc",
      authDomain: "doc-torat-suivi.firebaseapp.com",
      projectId: "doc-torat-suivi",
      storageBucket: "doc-torat-suivi.firebasestorage.app",
      messagingSenderId: "1069786941583",
      appId: "1:1069786941583:web:4537e52b05bbdc2bab48fa"
    };

    const app = initializeApp(firebaseConfig);

    initializeAppCheck(app, {
      provider: new ReCaptchaEnterpriseProvider('6LdPS6gtAAAAAGnQUWmV5sXsPYk6Yjc2sLiolwuN'),
      isTokenAutoRefreshEnabled: true
    });

    const db = getFirestore(app);

    function formatDuree(val) {
      if (val === undefined || val === null || isNaN(val) || Math.abs(val) < 1e-4) {
        return "0h";
      }
      const signe = val < 0 ? "-" : "";
      const absVal = Math.abs(val);
      let h = Math.floor(absVal);
      let m = Math.round((absVal - h) * 60);

      if (m === 60) {
        h += 1;
        m = 0;
      }

      return m === 0 ? `${signe}${h}h` : `${signe}${h}h${m.toString().padStart(2, '0')}`;
    }

    function formaterDateRelative(dateStr) {
      if (!dateStr || dateStr === "--") return "--";

      const now = new Date();
      const jour = String(now.getDate()).padStart(2, '0');
      const mois = String(now.getMonth() + 1).padStart(2, '0');
      const annee = now.getFullYear();
      const dateJour = `${jour}/${mois}/${annee}`;

      if (dateStr.includes(" à ")) {
        const [datePart, heurePart] = dateStr.split(" à ");
        if (datePart.trim() === dateJour) {
          return `aujourd'hui à ${heurePart.trim()}`;
        }
        return `le ${dateStr.trim()}`;
      }

      return `le ${dateStr.trim()}`;
    }

    function majJaugeFinance(paye, total, solde, factureNo) {
      const arcLongueur = 125.66;
      const bar = document.getElementById("gauge-progress");
      const soldeEl = document.getElementById("facture-du");
      const soldeLabelEl = document.querySelector(".solde-label");

      const classes = ["color-success", "color-warning", "color-danger", "color-neutral"];
      if (soldeEl) soldeEl.classList.remove(...classes);
      if (bar) bar.classList.remove(...classes);

      if (!factureNo || factureNo === "Aucune" || total <= 0) {
        if (bar) {
          bar.style.strokeDashoffset = arcLongueur;
          bar.classList.add("color-neutral");
        }
        if (soldeEl) {
          soldeEl.classList.add("color-neutral");
        }
        if (soldeLabelEl) soldeLabelEl.textContent = "Aucun solde";
        return;
      }

      const ratio = Math.min(Math.max(paye / total, 0), 1);
      const offset = arcLongueur * (1 - ratio);

      if (bar) {
        bar.style.strokeDashoffset = offset;
      }

      if (solde <= 0.01) {
        if (soldeEl) soldeEl.classList.add("color-success");
        if (bar) bar.classList.add("color-success");
        if (soldeLabelEl) soldeLabelEl.textContent = "Réglé ✓";
      } else if (paye > 0.01) {
        if (soldeEl) soldeEl.classList.add("color-warning");
        if (bar) bar.classList.add("color-warning");
        if (soldeLabelEl) soldeLabelEl.textContent = "Reste à payer";
      } else {
        if (soldeEl) soldeEl.classList.add("color-danger");
        if (bar) bar.classList.add("color-danger");
        if (soldeLabelEl) soldeLabelEl.textContent = "À payer";
      }
    }

    function afficherFacturesDetaillées(impayees, acquittees) {
      // 1. Factures impayées
      const contImpayees = document.getElementById("section-factures-impayees");
      const listImpayees = document.getElementById("list-factures-impayees");

      if (impayees && impayees.length > 0) {
        contImpayees.style.display = "flex";
        listImpayees.innerHTML = impayees.map(f => {
          const solde = parseFloat(f.solde ?? (f.total - (f.paye || 0))).toFixed(2);
          const acompte = parseFloat(f.paye || 0);
          const detailAcompte = acompte > 0 ? `<span style="font-size:10px; color:#b91c1c;">(Acompte : ${acompte.toFixed(2)} $)</span>` : '';

          return `
            <div class="past-invoice-row impayee">
              <div class="past-invoice-meta">
                <span class="past-invoice-no">Facture n° ${f.no}</span>
                <span class="past-invoice-date">Émise le ${f.date || '--'} ${detailAcompte}</span>
              </div>
              <span class="past-invoice-tag-danger">Dû : ${solde} $ ✗</span>
            </div>
          `;
        }).join("");
      } else {
        contImpayees.style.display = "none";
      }

      // 2. Factures acquittées
      const contAcquittees = document.getElementById("section-historique-factures");
      const listAcquittees = document.getElementById("past-invoices-list");

      if (acquittees && acquittees.length > 0) {
        contAcquittees.style.display = "flex";
        listAcquittees.innerHTML = acquittees.map(f => {
          const total = typeof f.total === 'number' ? f.total.toFixed(2) : parseFloat(f.total || 0).toFixed(2);
          return `
            <div class="past-invoice-row">
              <div class="past-invoice-meta">
                <span class="past-invoice-no">Facture n° ${f.no}</span>
                <span class="past-invoice-date">${f.date ? 'Émise le ' + f.date : 'Réglée'}</span>
              </div>
              <span class="past-invoice-tag">${total} $ ✓</span>
            </div>
          `;
        }).join("");
      } else {
        contAcquittees.style.display = "none";
      }
    }

    const urlParams = new URLSearchParams(window.location.search);
    let studentId = urlParams.get('id');

    if (studentId) {
      localStorage.setItem('doc_torat_token', studentId.trim());
    } else {
      studentId = localStorage.getItem('doc_torat_token');
    }

    function ecouterDonnees() {
      const container = document.getElementById("content-container");
      const loader = document.getElementById("loading-state");

      if (!studentId) {
        loader.innerText = "⚠️ Lien invalide. Aucun identifiant fourni.";
        return;
      }

      const docRef = doc(db, "eleves", studentId.toLowerCase().trim());

      onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
          const d = docSnap.data();
          loader.style.display = "none";
          container.style.display = "flex";

          document.getElementById("student-name").innerText = d.nom || studentId;

          // Mise à jour des heures et détection de solde négatif
          const totalVal = parseFloat(d.total) || 0;
          const totalHoursEl = document.getElementById("total-hours");
          totalHoursEl.innerText = formatDuree(totalVal);

          let alertZone = document.getElementById("alerte-solde-negatif");
          if (totalVal < 0) {
            totalHoursEl.classList.add("heures-negatives");
            if (!alertZone) {
              alertZone = document.createElement("div");
              alertZone.id = "alerte-solde-negatif";
              alertZone.className = "banner-renouvellement";
              totalHoursEl.parentElement.appendChild(alertZone);
            }
            alertZone.innerHTML = `⚠️ <strong>Forfait dépassé :</strong> Votre forfait actuel est épuisé. Pensez à sélectionner un forfait ci-dessous pour continuer l'accompagnement sereinement.`;
          } else {
            totalHoursEl.classList.remove("heures-negatives");
            if (alertZone) alertZone.remove();
          }

          document.getElementById("pres-hours").innerText = formatDuree(d.presentiel);
          document.getElementById("ligne-hours").innerText = formatDuree(d.en_ligne);
          document.getElementById("last-update-time").innerText = formaterDateRelative(d.maj || d.derniere_maj || "");

          const totalFacture = parseFloat(d.facture_total || 0);
          const payeFacture = parseFloat(d.facture_paye || 0);
          const duFacture = parseFloat(d.facture_du ?? (totalFacture - payeFacture));
          const noFacture = d.facture_no || "Aucune";

          document.getElementById("facture-no").innerText = noFacture;
          document.getElementById("facture-du").innerText = `${duFacture.toFixed(2)} $`;
          document.getElementById("facture-paye").innerText = `${payeFacture.toFixed(2)} $`;
          document.getElementById("facture-total").innerText = `${totalFacture.toFixed(2)} $`;

          majJaugeFinance(payeFacture, totalFacture, duFacture, noFacture);
          afficherFacturesDetaillées(d.factures_impayees || [], d.factures_passees || []);

          document.getElementById("btn-commander").onclick = () => commanderHeures(d.nom || studentId);
        } else {
          loader.innerText = "Élève non trouvé dans la base. Veuillez contacter votre tuteur.";
        }
      }, (err) => {
        console.error("Erreur Firestore en direct :", err);
        loader.innerText = "Erreur de chargement du dossier.";
      });
    }

    async function commanderHeures(nomEleve) {
      const btn = document.getElementById("btn-commander");
      const zone = document.getElementById("action-zone");
      const selectForfait = document.getElementById("choix-forfait");
      const forfaitChoisi = selectForfait.value;

      btn.disabled = true;
      btn.innerText = "Transmission en cours...";

      try {
        await addDoc(collection(db, "commandes"), {
          eleve: nomEleve,
          forfait: forfaitChoisi,
          date: serverTimestamp(),
          traite: false
        });

        zone.innerHTML = `
          <div class="confirmation-msg">
            ✅ <strong>Demande transmise avec succès !</strong><br>
            Forfait sélectionné : <strong>${forfaitChoisi}</strong>.<br><br>
            💳 <strong>Règlement :</strong> Veuillez effectuer un virement Interac à <em>doc-torat@outlook.com</em> ou me contacter par téléphone si vous avez la moindre question.
          </div>
        `;
      } catch (e) {
        console.error("Erreur enregistrement commande :", e);
        btn.disabled = false;
        btn.innerText = "💳 Commander ce forfait";
        alert("Une erreur est survenue lors de la transmission. Veuillez nous contacter directement.");
      }
    }

    window.afficherTab = (tab) => {
      const btnHeures = document.getElementById("tab-btn-heures");
      const btnReglement = document.getElementById("tab-btn-reglement");
      const viewHeures = document.getElementById("view-heures");
      const viewReglement = document.getElementById("view-reglement");

      if (tab === 'heures') {
        btnHeures.classList.add("active");
        btnReglement.classList.remove("active");
        viewHeures.style.display = "flex";
        viewReglement.style.display = "none";
      } else {
        btnReglement.classList.add("active");
        btnHeures.classList.remove("active");
        viewHeures.style.display = "none";
        viewReglement.style.display = "flex";
      }
    };

    window.addEventListener("DOMContentLoaded", ecouterDonnees);
  </script>
</head>
<body>

  <div class="card">
    <div class="header">
      <img src="./bonlogo.jpg" alt="Doc-torat Logo" style="width: 85px; height: auto; margin-bottom: 8px; border-radius: 50%;">
      <div class="logo">DOC-TORAT</div>
      <div class="subtitle">Espace Suivi & Forfaits</div>
    </div>

    <div id="loading-state" class="loader">
      Chargement du dossier élève...
    </div>

    <div id="content-container" style="display: none; width: 100%; flex-direction: column; align-items: center;">
      <div class="student-badge" id="student-name">
        Élève
      </div>

      <div class="tab-switch">
        <button id="tab-btn-heures" class="tab-btn active" onclick="afficherTab('heures')">⏱️ Mes Heures</button>
        <button id="tab-btn-reglement" class="tab-btn" onclick="afficherTab('reglement')">💳 Mes factures</button>
      </div>

      <!-- ONGLET 1 : HEURES -->
      <div id="view-heures" class="tab-content">
        <div class="gauge-container">
          <div class="total-hours" id="total-hours">0h</div>
          <div class="total-label">Heures restantes au forfait</div>
        </div>

        <div class="details-grid">
          <div class="detail-box">
            <div class="detail-val" id="pres-hours">0h</div>
            <div class="detail-label">Présentiel</div>
          </div>
          <div class="detail-box">
            <div class="detail-val" id="ligne-hours">0h</div>
            <div class="detail-label">En ligne</div>
          </div>
        </div>

        <div class="action-zone" id="action-zone">
          <label for="choix-forfait" class="action-label">
            Renouveler ou ajouter un forfait :
          </label>
          <select id="choix-forfait" class="select-forfait">
            <optgroup label="📍 Présentiel">
              <option value="Abonnement 5h (Présentiel) - 215$">Abonnement 5h — 215 $</option>
              <option value="Abonnement 10h (Présentiel) - 400$">Abonnement 10h — 400 $</option>
              <option value="Abonnement 20h (Présentiel) - 760$">Abonnement 20h — 760 $</option>
            </optgroup>
            <optgroup label="💻 En ligne">
              <option value="Abonnement 5h (En ligne) - 190$">Abonnement 5h — 190 $</option>
              <option value="Abonnement 10h (En ligne) - 350$">Abonnement 10h — 350 $</option>
              <option value="Abonnement 20h (En ligne) - 660$">Abonnement 20h — 660 $</option>
            </optgroup>
          </select>

          <button class="btn-commander" id="btn-commander">
            💳 Commander ce forfait
          </button>
        </div>
      </div>

      <!-- ONGLET 2 : STATUT RÈGLEMENT & HISTORIQUE -->
      <div id="view-reglement" class="tab-content" style="display: none;">
        <div class="facture-badge">
          Dernière facture : n° <strong id="facture-no">--</strong>
        </div>

        <div class="gauge-wrapper">
          <svg viewBox="0 0 100 58" class="semi-gauge">
            <path d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke="#edf2f7" stroke-width="8" stroke-linecap="round" />
            <path id="gauge-progress" d="M 10 50 A 40 40 0 0 1 90 50" fill="none" stroke="#1a365d" stroke-width="8"
                  stroke-dasharray="125.66" stroke-dashoffset="125.66" stroke-linecap="round" />
          </svg>
          <div class="gauge-center-text">
            <span class="solde-du" id="facture-du">0.00 $</span>
            <span class="solde-label">À payer</span>
          </div>
        </div>

        <div class="finance-details">
          <span>Acquitté : <strong id="facture-paye">0.00 $</strong></span>
          <span>Total facture : <strong id="facture-total">0.00 $</strong></span>
        </div>

        <!-- SECTION 1 : FACTURES EN ATTENTE DE RÈGLEMENT -->
        <div class="past-invoices-section" id="section-factures-impayees" style="display: none;">
          <span class="past-invoices-title danger">⚠️ Factures en attente</span>
          <div class="past-invoices-list impayees" id="list-factures-impayees"></div>
        </div>

        <!-- SECTION 2 : FACTURES ANTÉRIEURES ACQUITTÉES -->
        <div class="past-invoices-section" id="section-historique-factures" style="display: none;">
          <span class="past-invoices-title">📁 Factures antérieures acquittées</span>
          <div class="past-invoices-list" id="past-invoices-list"></div>
        </div>
      </div>

      <div class="last-update">
        Dernière mise à jour : <span id="last-update-time">--</span>
      </div>
    </div>
  </div>

</body>
</html>
